<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>아일라 키우기</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            transition: background-color 0.3s;
        }

        body.dark {
            background-color: #111;
        }

        /* 아일라 크기 조절 */
        img {
            max-width: 70%;
            max-height: 70%;
            image-rendering: pixelated;
        }

        /* 하단 중앙 버튼 */
        #darkModeBtn {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            background-color: #000;
            color: #fff;
        }

        body.dark #darkModeBtn {
            background-color: #fff;
            color: #000;
        }
    </style>
</head>
<body>

    <img src="element/아일라_Idle.gif" alt="아일라 Idle 애니메이션">

    <button id="darkModeBtn">다크모드</button>

    <script>
        const btn = document.getElementById("darkModeBtn");

        btn.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            btn.textContent = document.body.classList.contains("dark")
                ? "라이트모드"
                : "다크모드";
        });
    </script>

</body>
</html>
