<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>아일라 키우기</title>

    <!-- 모바일 확대 방지 -->
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: white;
            transition: background-color 0.3s;
        }

        body.dark {
            background-color: #111;
        }

        /* 아일라 */
        img {
            max-width: 70%;
            max-height: 70%;
            image-rendering: pixelated;
            margin-bottom: 10px;
        }

        /* 간지럽히기 버튼 */
        #tickleBtn {
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background-color: #ff7aa2;
            color: white;
            margin-bottom: 20px;
        }

        #tickleBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 다크모드 버튼 */
        #darkModeBtn {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 22px;
            font-size: 17px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            background-color: #000;
            color: #fff;
        }

        body.dark #darkModeBtn {
            background-color: #fff;
            color: #000;
        }

        /* 모바일 */
        @media (max-width: 600px) {
            img {
                max-width: 75%;
                max-height: 75%;
            }

            #tickleBtn {
                padding: 14px 30px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- 아일라 -->
    <img id="ayla" src="element/아일라_Idle.gif" alt="아일라">

    <!-- 간지럽히기 -->
    <button id="tickleBtn">간지럽히기</button>

    <!-- 다크모드 -->
    <button id="darkModeBtn">다크모드</button>

    <script>
        const ayla = document.getElementById("ayla");
        const tickleBtn = document.getElementById("tickleBtn");
        const darkBtn = document.getElementById("darkModeBtn");

        const GIF = {
            idle: "element/아일라_Idle.gif",
            t1: "element/아일라_Tickle_Idle1.gif",
            t2: "element/아일라_Tickle_Idle2.gif",
            end: "element/아일라_Tickle_End.gif"
        };

        let holdTimer = null;
        let isHolding = false;
        let isLocked = false;

        /* GIF 즉시 중단 + 처음부터 재생 */
        function playGIF(src) {
            ayla.src = "";
            ayla.offsetHeight; // reflow
            ayla.src = src + "?t=" + Date.now();
        }

        /* 간지럽히기 시작 */
        function startTickle() {
            if (isLocked) return;

            isHolding = true;
            playGIF(GIF.t1); // Idle 즉시 중단 → Tickle1

            holdTimer = setTimeout(() => {
                if (!isHolding) return;
                playGIF(GIF.t2); // Tickle1 즉시 중단 → Tickle2
            }, 3000);
        }

        /* 간지럽히기 종료 */
        function endTickle() {
            if (!isHolding || isLocked) return;

            isHolding = false;
            clearTimeout(holdTimer);

            playGIF(GIF.end); // 즉시 End
            lockTickle();
        }

        /* 버튼 잠금 */
        function lockTickle() {
            isLocked = true;
            tickleBtn.disabled = true;

            /* End GIF 재생 시간 (필요 시 조절) */
            setTimeout(() => {
                playGIF(GIF.idle); // Idle 복귀
            }, 1200);

            /* End 종료 + 2초 쿨타임 */
            setTimeout(() => {
                isLocked = false;
                tickleBtn.disabled = false;
            }, 3200);
        }

        /* 마우스 */
        tickleBtn.addEventListener("mousedown", startTickle);
        tickleBtn.addEventListener("mouseup", endTickle);
        tickleBtn.addEventListener("mouseleave", endTickle);

        /* 터치 */
        tickleBtn.addEventListener("touchstart", e => {
            e.preventDefault();
            startTickle();
        });
        tickleBtn.addEventListener("touchend", endTickle);

        /* 다크모드 */
        darkBtn.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            darkBtn.textContent =
                document.body.classList.contains("dark")
                ? "라이트모드"
                : "다크모드";
        });
    </script>

</body>
</html>
