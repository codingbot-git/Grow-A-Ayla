<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>아일라 키우기</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: white;
}
img {
    max-width: 70%;
    image-rendering: pixelated;
    margin-bottom: 12px;
}
button {
    padding: 12px 22px;
    font-size: 16px;
    border-radius: 9px;
    border: none;
    cursor: pointer;
    margin-top: 8px;
}
button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
</style>
</head>

<body>

<img id="aila" src="element/아일라_Idle.gif">
<button id="tickle">간지럽히기</button>

<script>
const img = document.getElementById("aila");
const btn = document.getElementById("tickle");

let state = "idle"; // idle | tickle1 | tickle2 | end | cooldown
let holding = false;
let holdTimer = null;
let pressTime = 0;

function play(src) {
    img.src = "";
    img.offsetHeight;
    img.src = src;
}

/* 눌렀을 때 */
btn.addEventListener("pointerdown", e => {
    if (state !== "idle") return;

    e.preventDefault(); // ★ 중요
    pressTime = Date.now();
    holding = true;
    state = "tickle1";

    play("element/아일라_Tickle_Idle1.gif");

    holdTimer = setTimeout(() => {
        if (holding && state === "tickle1") {
            state = "tickle2";
            play("element/아일라_Tickle_Idle2.gif");
        }
    }, 3000);
});

/* 뗐을 때 */
function release() {
    if (!holding) return;

    const heldDuration = Date.now() - pressTime;

    // 너무 짧은 클릭은 무시 (버그 방지)
    if (heldDuration < 150) return;

    holding = false;
    clearTimeout(holdTimer);

    if (state === "tickle1" || state === "tickle2") {
        state = "end";
        btn.disabled = true;

        play("element/아일라_Tickle_End.gif");

        setTimeout(() => {
            play("element/아일라_Idle.gif");
            state = "cooldown";

            setTimeout(() => {
                state = "idle";
                btn.disabled = false;
            }, 2000);

        }, 1200); // End GIF 길이
    }
}

btn.addEventListener("pointerup", release);
btn.addEventListener("pointerleave", release);
btn.addEventListener("pointercancel", release);
</script>

</body>
</html>
