<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>아일라 키우기</title>
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: white;
    transition: background-color 0.3s;
}

body.dark {
    background-color: #111;
}

/* 🔒 아일라 고정 박스 */
#aylaBox {
    width: 300px;
    height: 300px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 12px;
}

#aylaBox img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
}

#tickleBtn {
    padding: 14px 26px;
    font-size: 17px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 80px;
    touch-action: none; /* 모바일 입력 안정 */
}

#tickleBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#darkModeBtn {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 22px;
    font-size: 17px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    background-color: #000;
    color: #fff;
}

body.dark #darkModeBtn {
    background-color: #fff;
    color: #000;
}

/* 📱 모바일 */
@media (max-width: 600px) {
    #aylaBox {
        width: 260px;
        height: 260px;
    }

    #tickleBtn {
        padding: 16px 30px;
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div id="aylaBox">
    <img id="ayla" src="element/아일라_Idle.gif" alt="아일라">
</div>

<button id="tickleBtn">간지럽히기</button>
<button id="darkModeBtn">다크모드</button>

<script>
const ayla = document.getElementById("ayla");
const tickleBtn = document.getElementById("tickleBtn");
const darkBtn = document.getElementById("darkModeBtn");

const GIF = {
    idle: "element/아일라_Idle.gif",
    t1: "element/아일라_Tickle_Idle1.gif",
    t2: "element/아일라_Tickle_Idle2.gif",
    end: "element/아일라_Tickle_End.gif"
};

let state = "idle"; // idle | tickle1 | tickle2 | end
let holding = false;
let holdTimer = null;
let activePointerId = null;

function play(src) {
    ayla.src = "";
    ayla.offsetHeight; // GIF 리셋
    ayla.src = src;
}

/* 다크모드 */
darkBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    darkBtn.textContent =
        document.body.classList.contains("dark")
            ? "라이트모드"
            : "다크모드";
});

/* 간지럽히기 시작 */
tickleBtn.addEventListener("pointerdown", e => {
    if (state !== "idle") return;

    e.preventDefault();

    activePointerId = e.pointerId;
    tickleBtn.setPointerCapture(activePointerId);

    holding = true;
    state = "tickle1";

    play(GIF.t1);

    holdTimer = setTimeout(() => {
        if (holding && state === "tickle1") {
            state = "tickle2";
            play(GIF.t2);
        }
    }, 3000);
});

/* 손을 뗐을 때만 End */
function release(e) {
    if (!holding) return;
    if (e.pointerId !== activePointerId) return;

    holding = false;
    clearTimeout(holdTimer);

    tickleBtn.releasePointerCapture(activePointerId);
    activePointerId = null;

    if (state === "tickle1" || state === "tickle2") {
        state = "end";
        tickleBtn.disabled = true;

        play(GIF.end);

        setTimeout(() => {
            play(GIF.idle);

            setTimeout(() => {
                state = "idle";
                tickleBtn.disabled = false;
            }, 2000);

        }, 1200); // End GIF 길이
    }
}

tickleBtn.addEventListener("pointerup", release);
tickleBtn.addEventListener("pointercancel", release);
</script>

</body>
</html>
