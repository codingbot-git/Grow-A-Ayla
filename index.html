<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>아일라 키우기</title>

    <!-- 📱 모바일 확대 방지 -->
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            transition: background-color 0.3s;
        }

        body.dark {
            background-color: #111;
        }

        img {
            max-width: 70%;
            max-height: 70%;
            image-rendering: pixelated;
        }

        /* 버튼 (PC) */
        #darkModeBtn {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 22px;
            font-size: 17px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            background-color: #000;
            color: #fff;
        }

        body.dark #darkModeBtn {
            background-color: #fff;
            color: #000;
        }

        /* 📱 모바일 (조금만 축소) */
        @media (max-width: 768px) {
            #darkModeBtn {
                padding: 15px 26px;   /* ← 살짝 줄임 */
                font-size: 17px;
                border-radius: 11px;
                bottom: 30px;
            }

            img {
                max-width: 75%;
                max-height: 75%;
            }
        }

        /* 📐 가로모드 차단 화면 */
        #rotateLock {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            color: #fff;
            font-size: 20px;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        @media screen and (orientation: landscape) and (max-width: 768px) {
            #rotateLock {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div id="rotateLock">
        📱 세로 모드로 돌려주세요
    </div>

    <img src="element/아일라_Idle.gif" alt="아일라 Idle 애니메이션">

    <button id="darkModeBtn">다크모드</button>

    <script>
        const btn = document.getElementById("darkModeBtn");

        btn.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            btn.textContent = document.body.classList.contains("dark")
                ? "라이트모드"
                : "다크모드";
        });
    </script>

</body>
</html>
