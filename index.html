<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>아일라 키우기</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            transition: background-color 0.3s;
        }

        body.dark {
            background-color: #111;
        }

        img {
            max-width: 70%;
            max-height: 70%;
            image-rendering: pixelated;
        }

        /* 기본 버튼 (PC) */
        #darkModeBtn {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 22px;   /* ← 조금 키움 */
            border: none;
            border-radius: 9px;
            font-size: 17px;      /* ← 조금 키움 */
            cursor: pointer;
            background-color: #000;
            color: #fff;
        }

        body.dark #darkModeBtn {
            background-color: #fff;
            color: #000;
        }

        /* 📱 모바일 */
        @media (max-width: 768px) {
            #darkModeBtn {
                padding: 18px 32px;
                font-size: 19px;
                border-radius: 12px;
                bottom: 32px;
            }

            img {
                max-width: 80%;
                max-height: 80%;
            }
        }
    </style>
</head>
<body>

    <img src="element/아일라_Idle.gif" alt="아일라 Idle 애니메이션">

    <button id="darkModeBtn">다크모드</button>

    <script>
        const btn = document.getElementById("darkModeBtn");

        btn.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            btn.textContent = document.body.classList.contains("dark")
                ? "라이트모드"
                : "다크모드";
        });
    </script>

</body>
</html>
