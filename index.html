<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>아일라 키우기</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: white;
        transition: background-color 0.3s;
    }

    body.dark {
        background-color: #111;
    }

    img {
        max-width: 70%;
        max-height: 70%;
        image-rendering: pixelated;
        margin-bottom: 15px;
    }

    #tickleBtn, #darkModeBtn {
        padding: 12px 22px;
        font-size: 16px;
        border: none;
        border-radius: 9px;
        cursor: pointer;
        margin-top: 8px;
    }

    #tickleBtn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    #darkModeBtn {
        margin-top: 16px;
        background-color: #000;
        color: #fff;
    }

    body.dark #darkModeBtn {
        background-color: #fff;
        color: #000;
    }
</style>
</head>

<body>

<img id="ailaImg" src="element/아일라_Idle.gif">

<button id="tickleBtn">간지럽히기</button>
<button id="darkModeBtn">다크모드</button>

<script>
const img = document.getElementById("ailaImg");
const tickleBtn = document.getElementById("tickleBtn");
const darkBtn = document.getElementById("darkModeBtn");

let state = "idle"; // idle | tickle1 | tickle2 | end | cooldown
let holdTimer = null;
let holding = false;

/* GIF 강제 재시작 함수 */
function play(src) {
    img.src = "";
    img.offsetHeight;
    img.src = src;
}

/* ===== 간지럽히기 버튼 ===== */

tickleBtn.addEventListener("pointerdown", () => {
    if (state !== "idle") return;

    holding = true;
    state = "tickle1";
    play("element/아일라_Tickle_Idle1.gif");

    holdTimer = setTimeout(() => {
        if (holding && state === "tickle1") {
            state = "tickle2";
            play("element/아일라_Tickle_Idle2.gif");
        }
    }, 3000);
});

function releaseTickle() {
    if (!holding) return;
    holding = false;
    clearTimeout(holdTimer);

    if (state === "tickle1" || state === "tickle2") {
        state = "end";
        tickleBtn.disabled = true;
        play("element/아일라_Tickle_End.gif");

        /* End 애니메이션 종료 후 */
        setTimeout(() => {
            play("element/아일라_Idle.gif");
            state = "cooldown";

            setTimeout(() => {
                state = "idle";
                tickleBtn.disabled = false;
            }, 2000);

        }, 1200); // End GIF 길이에 맞게 조절
    }
}

tickleBtn.addEventListener("pointerup", releaseTickle);
tickleBtn.addEventListener("pointerleave", releaseTickle);
tickleBtn.addEventListener("pointercancel", releaseTickle);

/* ===== 다크모드 ===== */

darkBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    darkBtn.textContent = document.body.classList.contains("dark")
        ? "라이트모드"
        : "다크모드";
});
</script>

</body>
</html>
