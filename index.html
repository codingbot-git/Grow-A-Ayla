<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>아일라 키우기</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            transition: background-color 0.3s;
        }

        body.dark {
            background-color: #111;
        }

        img {
            max-width: 90%;
            max-height: 90%;
            image-rendering: pixelated;
        }

        /* 다크모드 버튼 */
        #darkModeBtn {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            background-color: #000;
            color: #fff;
        }

        body.dark #darkModeBtn {
            background-color: #fff;
            color: #000;
        }
    </style>
</head>
<body>

    <button id="darkModeBtn">다크모드</button>

    <img src="element/아일라_Idle.gif" alt="아일라 Idle 애니메이션">

    <script>
        const btn = document.getElementById("darkModeBtn");

        btn.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            btn.textContent = document.body.classList.contains("dark")
                ? "라이트모드"
                : "다크모드";
        });
    </script>

</body>
</html>
